---
id: registry.artifact-types
title: Artifact Type Registry
type: registry
status: draft
owners:
  - ui-foundations
created: 2026-07-09
updated: 2026-07-09
authority: source
summary: Defines artifact classes used by repository registry and sync contract documents.

version: 0.1

artifact_types:
  - name: governance-rule
    description: A normative rule governing trust, review, ownership, lifecycle, naming, tokens, components, or accessibility.
    canonical_locations:
      - governance/
      - specifications/
      - exports/governance-pack/

  - name: naming-rule
    description: A governance artifact that defines stable naming expectations for reusable UI Foundations concepts.
    canonical_locations:
      - exports/governance-pack/
      - governance/
      - reference/

  - name: naming-contract
    description: A machine-readable governance artifact that defines portable naming rules for runtime consumption.
    canonical_locations:
      - exports/governance-pack/contracts/
      - schemas/

  - name: token-governance
    description: A governance artifact that defines token decision, naming, lifecycle, and consumer impact expectations.
    canonical_locations:
      - exports/governance-pack/
      - ui-foundations/tokens/

  - name: component-governance
    description: A governance artifact that defines component model, lifecycle, state, composition, and review expectations.
    canonical_locations:
      - exports/governance-pack/
      - ui-foundations/components/

  - name: governance-pack-release
    description: A versioned release of governance guidance intended for reviewed consuming-repo adoption.
    canonical_locations:
      - registry/governance-packs.yml
      - exports/governance-pack/pack.yml
      - exports/governance-pack/CHANGELOG.md

  - name: specification
    description: A normative definition of expected structure, behavior, or validation.
    canonical_locations:
      - specifications/
      - ui-foundations/

  - name: workflow
    description: A repeatable human or agent activity that references higher-precedence rules.
    canonical_locations:
      - workflows/
      - operational/

  - name: prompt
    description: A reusable session starter or agent instruction that operationalizes vault knowledge.
    canonical_locations:
      - prompts/
      - exports/agent-pack/

  - name: agent-guidance
    description: Tool-independent guidance for agent roles, behavior, boundaries, and review stance.
    canonical_locations:
      - AGENTS.md
      - agents/
      - exports/agent-pack/

  - name: runtime-expectation
    description: Non-code expectation for runtime implementation, validation, package boundaries, or CSS architecture.
    canonical_locations:
      - ui-foundations/
      - operational/
      - exports/runtime-pack/

  - name: accessibility-baseline
    description: Minimum accessibility expectation reusable across UI Foundations runtime and documentation repositories.
    canonical_locations:
      - foundations/
      - operational/
      - exports/governance-pack/

  - name: lesson
    description: Extracted learning from an issue, PR, incident, experiment, or review.
    canonical_locations:
      - knowledge/lessons/

  - name: export-pack
    description: Curated bundle of vault guidance intended for reviewed consumption by other repositories.
    canonical_locations:
      - exports/
