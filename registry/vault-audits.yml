# Vault Audit Registry

## Purpose

This registry declares the first repeatable vault audits and the smallest composition needed to run them together.

It does not redefine canonical vault rules. Each audit references the governance, specification, reference, and pattern sources that own the rule meaning.

## Execution Boundary

Audit execution is read-only by default. Findings may recommend changes, but fixes require a separate explicit instruction or command.

## Deterministic CLI Execution

Run one audit:

```sh
ruby schemas/validate-vault-audits.rb --audit frontmatter
ruby schemas/validate-vault-audits.rb --audit links
ruby schemas/validate-vault-audits.rb --audit taxonomy
```

Run the composed quick audit:

```sh
ruby schemas/validate-vault-audits.rb --audit all
```

Emit machine-readable findings:

```sh
ruby schemas/validate-vault-audits.rb --audit all --format json
```

The deterministic runner validates every finding against `schema.vault-audit-result` before emitting text or JSON.

## Goose Usage

For local Qwen/Goose work, run deterministic audit commands first, then ask Goose to interpret only `warn` findings or ambiguous remediation using the relevant workflow:

```text
Use vault-taxonomy-audit and knowledge-precedence to interpret these taxonomy warnings. Treat uncertain findings as warnings, not failures.
```

Use local Qwen for summarizing findings, classifying low-risk documents, or preparing small proposed diffs. Use a stronger provider for broad reclassification, authority conflicts, or changes that affect governance meaning.

## Codex CLI Usage

Use Codex for bounded review or implementation follow-up after deterministic evidence exists:

```sh
codex "Review the JSON output from ruby schemas/validate-vault-audits.rb --audit all --format json and propose the smallest safe fixes. Do not edit without explicit instruction."
```

Codex follow-up must keep audit mode read-only unless the prompt explicitly requests a separate fix pass.
