---
id: registry.project-projections
title: Project Projection Registry
type: registry
status: review
owners:
  - ui-foundations
created: 2026-09-18
updated: 2026-09-18
authority: source
summary: Declares deterministic project projection materializations, consumer constraints, delivery semantics, and validation requirements.

version: 0.3

projections:
  - id: chatgpt-project
    consumer: chatgpt-project
    fragment_pack_id: export-pack.agent.fragments.project-bootstrap
    fragment_pack_path: exports/agent-pack/fragments/project-bootstrap.yml
    fragment_ids:
      - identity
      - section-1-scope-boundary
      - section-2-ecosystem-model
      - section-3-authority
      - section-4-agentic-operating-model
      - section-5-execution
      - section-6-execution-modes
      - section-7-evidence
      - section-8-persist-state-not-conversation
      - section-9-design-system-principles
      - section-10-provider-neutrality
      - section-11-library-memory-and-research
      - section-12-decision-quality
      - section-13-default-interaction
    separator: "\n\n"
    output_path: .generated/project-projections/chatgpt-project.instructions.md
    delivery: snapshot
    materialization: generated
    sync_mode: manual_copy
    limits:
      max_characters: 8000
    required_contains:
      - UI Foundations Intelligence
      - UIF-VLT
      - Chat history and memory provide context, not execution state.
      - UIF is a private PoC and must remain strictly separated from TUI's official **UILib / TUI Design System**.
    refresh:
      trigger: source-change
      command: ruby scripts/generate-project-projections.rb

  - id: kiro-uif-int
    consumer: kiro
    delivery: live-reference
    materialization: reference
    sync_mode: documentation_reference
    contract_document_id: export-pack.agent.projection.kiro-bootstrap
    contract_document_path: exports/agent-pack/projections/kiro-bootstrap.md
    reference:
      repository: tbielich/ui-foundations-intelligence
      path: AGENTS.md
    required_contains:
      - "Primary repository instruction surface: `AGENTS.md`"
      - "Do not copy the same shared UIF guidance into `.kiro/steering/`."
      - "No additional Kiro bootstrap steering file is required for UIF-INT merely to repeat the shared bootstrap guidance."
      - "Use the shared repository contract directly; add provider steering only for provider differences."
