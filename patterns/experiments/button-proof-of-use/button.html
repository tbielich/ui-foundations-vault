<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Button Proof of Use</title>
    <link rel="stylesheet" href="./button.css">
  </head>
  <body>
    <main class="page">
      <h1>Button Proof of Use</h1>

      <section class="example-set" aria-labelledby="button-examples-heading">
        <h2 id="button-examples-heading">Examples</h2>

        <div class="example-row">
          <button class="uif-button solid" type="button" data-uif-component="button">
            <span class="uif-button-label">Continue</span>
          </button>

          <button class="uif-button outline is-disabled" type="button" data-uif-component="button" disabled>
            <span class="uif-button-label">Save changes</span>
          </button>

          <button class="uif-button ghost icon-only" type="button" data-uif-component="button" aria-label="Close dialog">
            <span class="uif-button-icon" aria-hidden="true">x</span>
          </button>

          <button class="uif-button solid is-loading is-disabled" type="button" data-uif-component="button" data-loading="true" aria-busy="true" disabled>
            <span class="uif-button-spinner" aria-hidden="true"></span>
            <span class="uif-button-label">Save changes</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
