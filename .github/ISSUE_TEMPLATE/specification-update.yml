name: Specification update
description: Create, revise, review, or retire a canonical UI Foundations specification.
title: "[Knowledge] Specification: <short outcome>"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for vault-owned specification work.

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Owning architectural layer.
      options:
        - Knowledge
      default: 0
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Select the Knowledge domain affected by the specification update.
      options:
        - Reference
        - Governance
        - Operational
        - Architecture
        - Capability
        - Foundation
        - Glossary
      default: 0
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic
      description: Larger initiative or outcome this work belongs to, if known.
      placeholder: Not yet selected
    validations:
      required: true

  - type: dropdown
    id: artifact
    attributes:
      label: Artifact
      description: Concrete artifact being created, changed, reviewed, or retired.
      options:
        - Specification
      default: 0
    validations:
      required: true

  - type: input
    id: implementation
    attributes:
      label: Implementation
      description: Specification document, document identifier, repository path, or "Not yet selected".
      placeholder: specifications/document-structure.md
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Short description of the intended outcome.
      placeholder: Describe the specification outcome this issue should produce.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Confirm what is in scope for this specification update.
      options:
        - label: Metadata, document structure, classification model, issue template model, or another canonical specification is created, revised, reviewed, or retired.
          required: true
        - label: Expected behavior, structure, constraints, or validation expectations are made explicit.
          required: true
        - label: Tool-specific mappings remain implementation evidence and do not redefine the canonical model.
          required: true

  - type: textarea
    id: related-documents
    attributes:
      label: Related Documents
      description: List canonical vault documents that govern, are affected by, or provide evidence for this work.
      placeholder: |
        - specifications/...
        - governance/...
        - reference/...
        - foundations/...
    validations:
      required: true

  - type: textarea
    id: canonical-source-impact
    attributes:
      label: Canonical Source Impact
      description: Describe affected canonical documents, specifications, governance, and relationships.
      value: |
        - Affected canonical documents:
        - Affected specifications:
        - Affected governance:
        - Affected relationships:
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Markdown checklist of observable completion criteria.
      value: |
        - [ ] Specification meaning is clear and tool-independent.
        - [ ] Vault structure and metadata expectations are satisfied.
        - [ ] Required references identify governing and affected documents.
        - [ ] Boundary check confirms implementation mappings do not override canonical specifications.
    validations:
      required: true

  - type: checkboxes
    id: validation
    attributes:
      label: Validation
      description: Checks required before this issue can be considered ready.
      options:
        - label: Metadata is valid.
          required: true
        - label: References resolve.
          required: true
        - label: Glossary terminology is used consistently.
          required: true
        - label: Classification model is respected.
          required: true
        - label: Governance has been reviewed.
          required: true
        - label: No duplicate canonical knowledge is introduced.
          required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Explicitly describe what must not be changed.
      value: |
        - Do not change GitHub mappings unless a separate implementation update is in scope.
        - Do not create automation.
        - Do not add runtime implementation, package dependencies, or generated output.
        - Do not change another repository.
    validations:
      required: true
