name: Specification update
description: Create, revise, review, or retire a canonical UI Foundations specification.
title: "[Knowledge] Specification: <short outcome>"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for vault-owned specification work. Specifications define expected behavior, structure, constraints, and validation expectations. Do not request runtime implementation or automation here.
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Describe why this specification work is needed.
      placeholder: What behavior, structure, or expectation needs to be specified?
    validations:
      required: true
  - type: textarea
    id: knowledge-change
    attributes:
      label: Specification change
      description: Describe the specification to create, revise, review, or retire.
      placeholder: Summarize the intended specification change.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what the specification must cover and what is intentionally out of scope.
      placeholder: Include in scope and out of scope notes.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: The owning architectural layer.
      options:
        - Knowledge
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Select the Knowledge domain affected by the specification.
      options:
        - Foundation
        - Reference
        - Governance
        - Capability
        - Operational
        - Glossary
        - Architecture
    validations:
      required: true
  - type: dropdown
    id: artifact
    attributes:
      label: Artifact
      description: The canonical artifact type for this form.
      options:
        - Specification
    validations:
      required: true
  - type: input
    id: implementation
    attributes:
      label: Implementation
      description: Identify the specification document, document id, repository path, or use "Not yet selected".
      placeholder: specifications/example.md or Not yet selected
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Required references
      description: List governing documents, related specifications, decisions, workflows, capabilities, or affected artifacts.
      placeholder: Use stable document ids, repository paths, or "No existing reference" with a short explanation.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Include outcome, evidence, and boundary check.
      value: |
        - Outcome:
        - Evidence:
        - Boundary check:
    validations:
      required: true
  - type: textarea
    id: validation-expectations
    attributes:
      label: Validation expectations
      description: State what must be checked, who or what can check it, required evidence, and the repository or layer boundary to preserve.
      value: |
        - Check:
        - Checked by:
        - Evidence:
        - Boundary:
    validations:
      required: true
  - type: textarea
    id: optional-context
    attributes:
      label: Optional context
      description: Add non-goals, related terminology, impact on other repositories, open questions, or review notes.
    validations:
      required: false
