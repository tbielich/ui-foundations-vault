name: Knowledge update
description: Create, revise, review, or retire canonical UI Foundations knowledge.
title: "[Knowledge] <artifact>: <short outcome>"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Knowledge-layer work owned by the vault. Do not request runtime implementation, automation, or changes in another repository here.
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Describe why this knowledge work is needed.
      placeholder: What should this issue make clearer, more complete, or more accurate?
    validations:
      required: true
  - type: textarea
    id: knowledge-change
    attributes:
      label: Knowledge change
      description: Describe the canonical knowledge to create, revise, review, or retire.
      placeholder: Summarize the intended knowledge change.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what is included and what is intentionally out of scope.
      placeholder: Include in scope and out of scope notes.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: The owning architectural layer.
      options:
        - Knowledge
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Select the Knowledge domain. This maps to the corresponding domain classification.
      options:
        - Foundation
        - Reference
        - Governance
        - Capability
        - Operational
        - Glossary
        - Architecture
    validations:
      required: true
  - type: dropdown
    id: artifact
    attributes:
      label: Artifact
      description: Select the knowledge artifact type.
      options:
        - Principle
        - Decision
        - Specification
        - Workflow
        - Prompt
        - Glossary term
        - Agent capability
        - Index
        - Reference
        - Other knowledge artifact
    validations:
      required: true
  - type: input
    id: implementation
    attributes:
      label: Implementation
      description: Identify the vault document, document id, repository path, or use "Not yet selected".
      placeholder: specifications/example.md or Not yet selected
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Required references
      description: List governing documents, existing artifacts, and related specifications, decisions, workflows, prompts, capabilities, or glossary terms.
      placeholder: Use stable document ids, repository paths, or "No existing reference" with a short explanation.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Include outcome, evidence, and boundary check.
      value: |
        - Outcome:
        - Evidence:
        - Boundary check:
    validations:
      required: true
  - type: textarea
    id: validation-expectations
    attributes:
      label: Validation expectations
      description: State what must be checked, who or what can check it, required evidence, and the repository or layer boundary to preserve.
      value: |
        - Check:
        - Checked by:
        - Evidence:
        - Boundary:
    validations:
      required: true
  - type: textarea
    id: optional-context
    attributes:
      label: Optional context
      description: Add related terminology, impact on other repositories, open questions, or review notes.
    validations:
      required: false
