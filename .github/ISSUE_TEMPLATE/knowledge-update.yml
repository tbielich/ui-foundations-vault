name: Knowledge update
description: Create, revise, review, or retire canonical UI Foundations knowledge.
title: "[Knowledge] <artifact>: <short outcome>"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Knowledge-layer work owned by the vault.

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Owning architectural layer.
      options:
        - Knowledge
      default: 0
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Select the Knowledge domain for this update.
      options:
        - Foundation
        - Reference
        - Glossary
        - Operational
        - Capability
        - Architecture
      default: 0
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic
      description: Larger initiative or outcome this work belongs to, if known.
      placeholder: Not yet selected
    validations:
      required: true

  - type: dropdown
    id: artifact
    attributes:
      label: Artifact
      description: Concrete knowledge artifact being created, changed, reviewed, or retired.
      options:
        - Principle
        - Reference
        - Glossary term
        - Operational guidance
        - Agent capability
        - Architecture knowledge
        - Index
        - Other knowledge artifact
      default: 0
    validations:
      required: true

  - type: input
    id: implementation
    attributes:
      label: Implementation
      description: Vault document, document identifier, repository path, or "Not yet selected".
      placeholder: foundations/design-principles.md
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Short description of the intended outcome.
      placeholder: Describe the canonical knowledge outcome this issue should produce.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Confirm what is in scope for this knowledge update.
      options:
        - label: Foundations, reference, glossary, operational, capability, or architecture knowledge is created, revised, reviewed, or retired.
          required: true
        - label: The update remains human-readable and agent-readable.
          required: true
        - label: Cross-repository impact is described without changing another repository.
          required: true

  - type: textarea
    id: related-documents
    attributes:
      label: Related Documents
      description: List canonical vault documents that govern, are affected by, or provide evidence for this work.
      placeholder: |
        - foundations/...
        - governance/...
        - specifications/...
        - reference/...
    validations:
      required: true

  - type: textarea
    id: canonical-source-impact
    attributes:
      label: Canonical Source Impact
      description: Describe affected canonical documents, specifications, governance, and relationships.
      value: |
        - Affected canonical documents:
        - Affected specifications:
        - Affected governance:
        - Affected relationships:
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Markdown checklist of observable completion criteria.
      value: |
        - [ ] Intended canonical meaning is clear.
        - [ ] Vault structure and metadata expectations are satisfied.
        - [ ] Related documents and identifiers are traceable.
        - [ ] Boundary check confirms the work remains in the Knowledge layer.
    validations:
      required: true

  - type: checkboxes
    id: validation
    attributes:
      label: Validation
      description: Checks required before this issue can be considered ready.
      options:
        - label: Metadata is valid.
          required: true
        - label: References resolve.
          required: true
        - label: Glossary terminology is used consistently.
          required: true
        - label: Classification model is respected.
          required: true
        - label: Governance has been reviewed.
          required: true
        - label: No duplicate canonical knowledge is introduced.
          required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Explicitly describe what must not be changed.
      value: |
        - Do not change runtime implementation assets.
        - Do not create automation.
        - Do not change another repository.
        - Do not redefine canonical specifications or governance unless explicitly in scope.
    validations:
      required: true
