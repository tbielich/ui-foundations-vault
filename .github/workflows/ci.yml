name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate vault repository basics
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test -f .github/workflows/publish.yml
          echo "Markdown files: $(find . -type f -name '*.md' | wc -l)"

      - name: Validate project projections
        run: ruby scripts/generate-project-projections.rb --check

      - name: Validate governance packs
        run: ruby schemas/validate-governance-packs.rb

      - name: Run vault audit self-tests
        run: |
          set -euo pipefail
          ruby schemas/validate-vault-audits.rb --self-test-contract
          ruby schemas/validate-vault-audits.rb --self-test-frontmatter

      - name: Figma guidelines export tests
        # Deterministic stdlib tests covering: standalone script loadability,
        # positive synthetic export, verbatim multiline body preservation,
        # type-based normativity (informative sources stay informative),
        # rule-level provenance, determinism and --check non-mutation,
        # pack/registry/schema/artifact input invalidation, eligibility
        # negatives, duplicate/alias/invalid-UTF-8 metadata, size and hard-cap
        # budgets, source and output symlink escapes, preexisting-output and
        # sentinel protection, schema dialect/keyword enforcement, and the
        # real 0.9.0 candidate export and deterministic regeneration; review-channel
        # rejection remains covered by test_negative_pack_channel.
        # Lifecycle rejection assertions remain in the suite, not in a fragile shell
        # expectation. No network, dependencies, or publishing.
        run: ruby scripts/test-figma-export.rb
