$schema: https://json-schema.org/draft/2020-12/schema
$id: schemas/governance-pack.schema.yml
title: Governance Pack Manifest Schema
type: object
required:
  - id
  - title
  - type
  - status
  - owners
  - created
  - updated
  - authority
  - pack
  - artifacts
  - protected_boundaries
  - review
properties:
  id:
    type: string
  title:
    type: string
  type:
    const: export-pack
  status:
    enum:
      - draft
      - review
      - accepted
      - stable
      - deprecated
      - archived
  owners:
    type: array
    items:
      type: string
  created:
    type: string
  updated:
    type: string
  authority:
    enum:
      - source
      - supporting
      - derived
      - example
  pack:
    type: object
    required:
      - id
      - title
      - version
      - channel
      - owner
      - registry
      - changelog
    properties:
      id:
        type: string
      title:
        type: string
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      channel:
        enum:
          - draft
          - review
          - stable
          - deprecated
      owner:
        type: string
      registry:
        type: string
      changelog:
        type: string
  artifacts:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - title
        - type
        - path
        - status
        - review_required
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        path:
          type: string
        status:
          type: string
        review_required:
          type: boolean
  protected_boundaries:
    type: object
  review:
    type: object
  validation:
    type: object
